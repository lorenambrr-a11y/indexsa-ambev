<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<meta name="mobile-web-app-capable" content="yes">
<title>Roteiro PDV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root {
    --bar: #16324f; --bar-ink: #ffffff;
    --bg: #ffffff; --soft: #f2f4f7; --line: #dde2e8;
    --ink: #17202a; --muted: #5f6b78;
    --dia: #d98200; --noite: #4338ca; --sem: #6b7280; --ok: #15803d;
    --route: #e0671f; --warn: #fff1e6; --warn-ink: #b54708;
    --radius: 14px;
    --top: calc(56px + env(safe-area-inset-top));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--soft);
    font-family: Roboto, "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- Barra superior ---------- */
  #topbar { position: fixed; inset: 0 0 auto 0; height: var(--top); padding: env(safe-area-inset-top) 8px 0 16px;
    background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; gap: 8px; z-index: 1000;
    box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  #topbar h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar h1 small { display: block; font-size: 12px; font-weight: 400; opacity: .8; }
  .icon-btn { position: relative; min-width: 48px; height: 48px; border: 0; border-radius: 24px;
    background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 12px; font-size: 15px; font-weight: 500; }
  .icon-btn:active { background: rgba(255,255,255,.15); }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .badge { position: absolute; top: 6px; right: 4px; min-width: 18px; height: 18px; border-radius: 9px;
    background: #f97316; color: #fff; font-size: 11px; line-height: 18px; text-align: center; padding: 0 4px; }
  .badge:empty { display: none; }

  #map { position: fixed; top: var(--top); left: 0; right: 0; bottom: 0; }

  /* ---------- Botões flutuantes ---------- */
  .fab { position: fixed; right: 14px; z-index: 900; width: 48px; height: 48px; border-radius: 50%; border: 0;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
  .fab svg { width: 24px; height: 24px; fill: #16324f; }
  #btnLocate { bottom: calc(var(--sheet-peek, 88px) + 16px + env(safe-area-inset-bottom)); }

  /* ---------- Bottom sheet (lista) ---------- */
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 950; background: var(--bg);
    border-radius: var(--radius) var(--radius) 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.18);
    display: flex; flex-direction: column; max-height: 62dvh; transition: transform .22s ease;
    padding-bottom: env(safe-area-inset-bottom); }
  #sheet.collapsed { transform: translateY(calc(100% - var(--sheet-peek, 88px) - env(safe-area-inset-bottom))); }
  #sheetHead { flex-shrink: 0; border: 0; background: none; width: 100%; text-align: left; padding: 8px 16px 12px; }
  #sheetHead::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px;
    background: #c5ccd4; margin: 0 auto 10px; }
  #sumLine1 { font-size: 16px; font-weight: 600; }
  #sumLine2 { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #navLinks { flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
  #navLinks:empty { display: none; }
  .chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px;
    border-radius: 20px; border: 1px solid var(--line); background: var(--soft); color: var(--ink);
    text-decoration: none; font-size: 14px; font-weight: 500; }
  .chip.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  #lista { overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); }
  .item { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 60px; padding: 8px 16px;
    border: 0; border-bottom: 1px solid #eef1f4; background: none; text-align: left; }
  .item:active { background: var(--soft); }
  .num { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .item b { display: block; font-weight: 500; font-size: 15px; }
  .item small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .flag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px;
    background: var(--warn); color: var(--warn-ink); margin-left: 4px; vertical-align: 1px; }
  .more { padding: 14px 16px; color: var(--muted); font-size: 13px; }

  /* ---------- Painel de filtros ---------- */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1100; opacity: 0; pointer-events: none;
    transition: opacity .2s; }
  #scrim.show { opacity: 1; pointer-events: auto; }
  #filters { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1200; background: var(--bg);
    border-radius: var(--radius) var(--radius) 0 0; max-height: 88dvh; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform .22s ease; padding-bottom: env(safe-area-inset-bottom); }
  #filters.show { transform: none; }
  #filters header { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 6px 20px; }
  #filters header h2 { font-size: 18px; margin: 0; }
  #filters header button { color: var(--ink); }
  #filters header button svg { fill: var(--ink); }
  .fbody { overflow-y: auto; padding: 4px 20px 12px; display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .field select, .field input[type=search] { font-size: 16px; min-height: 48px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; -webkit-appearance: none; appearance: none; }
  .field select { background-image: linear-gradient(45deg, transparent 50%, #5f6b78 50%), linear-gradient(135deg, #5f6b78 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    font-size: 14px; color: var(--ink); padding: 0 4px; }
  .seg button.on { background: #16324f; border-color: #16324f; color: #fff; }
  .switch { display: flex; align-items: center; justify-content: space-between; min-height: 48px; font-size: 15px; color: var(--ink); font-weight: 400; }
  .switch input { width: 22px; height: 22px; accent-color: #16324f; }
  .factions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  .factions button { min-height: 48px; border-radius: 24px; font-size: 15px; font-weight: 600; }
  #btnLimpar { background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
  #btnAplicar { background: #16324f; border: 0; color: #fff; }

  /* ---------- Pins e popup ---------- */
  .pin { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
  .pin span { transform: rotate(45deg); color: #fff; font-size: 11px; font-weight: 700; }
  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.4; }
  .leaflet-container a.leaflet-popup-close-button { width: 36px; height: 36px; font-size: 22px; line-height: 34px; }
  .pop h3 { margin: 0 28px 4px 0; font-size: 15px; }
  .pop .tag { display: inline-block; font-size: 11px; font-weight: 600; color: #fff; padding: 2px 8px; border-radius: 8px; margin-bottom: 6px; }
  .pop dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 6px 0 10px; }
  .pop dt { color: var(--muted); }
  .pop dd { margin: 0; overflow-wrap: anywhere; }
  .pop .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .pop .acts a { flex: 1; min-width: 90px; }
  .pop .chip { justify-content: center; }
  .pop .warn { background: var(--warn); color: var(--warn-ink); border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; }

  .legend { background: #fff; padding: 8px 10px; border-radius: 10px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.25); line-height: 1.7; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  #toast { position: fixed; left: 50%; top: calc(var(--top) + 12px); transform: translateX(-50%); z-index: 1300;
    background: #323232; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }

  /* ---------- Desktop / tablet grande ---------- */
  @media (min-width: 900px) {
    #map { left: 380px; }
    #sheet, #sheet.collapsed { top: var(--top); right: auto; width: 380px; max-height: none; border-radius: 0;
      transform: none; box-shadow: 1px 0 0 var(--line); }
    #sheetHead { pointer-events: none; }
    #sheetHead::before { display: none; }
    #btnLocate { bottom: 24px; }
    #filters { left: auto; right: 16px; top: calc(var(--top) + 8px); bottom: auto; width: 380px; border-radius: var(--radius);
      transform: translateY(-12px); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; max-height: calc(100dvh - var(--top) - 24px); }
    #filters.show { transform: none; opacity: 1; pointer-events: auto; }
    #scrim.show { background: transparent; }
  }
</style>
</head>
<body>
<div id="topbar">
  <h1>Roteiro PDV<small id="subtitle">Todos os PDVs</small></h1>
  <button class="icon-btn" id="btnFiltros" aria-label="Filtros">
    <svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm4 6h10v2H7zm3 6h4v2h-4z"/></svg>
    <span>Filtros</span><span class="badge" id="fBadge"></span>
  </button>
</div>

<div id="map"></div>

<button class="fab" id="btnLocate" aria-label="Minha localização">
  <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.94 3A8.99 8.99 0 0 0 13 3.06V1h-2v2.06A8.99 8.99 0 0 0 3.06 11H1v2h2.06A8.99 8.99 0 0 0 11 20.94V23h2v-2.06A8.99 8.99 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
</button>

<section id="sheet" class="collapsed">
  <button id="sheetHead" aria-label="Mostrar lista">
    <div id="sumLine1">—</div>
    <div id="sumLine2">Toque para ver a lista</div>
  </button>
  <div id="navLinks"></div>
  <div id="lista"></div>
</section>

<div id="scrim"></div>
<section id="filters" aria-label="Filtros">
  <header>
    <h2>Filtros</h2>
    <button class="icon-btn" id="btnFechar" aria-label="Fechar">
      <svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </button>
  </header>
  <div class="fbody">
    <label class="field">Região<select id="fReg"></select></label>
    <div class="field">Tipo de rota
      <div class="seg" id="fTipo">
        <button data-v="" class="on">Todas</button><button data-v="Diurna">Diurna</button>
        <button data-v="Noturna">Noturna</button><button data-v="Sem Horário">Sem hor.</button>
      </div>
    </div>
    <label class="field">Dia / rota<select id="fDia"></select></label>
    <label class="field">UNB<select id="fUnb"></select></label>
    <div class="field">Pesquisadora
      <div class="seg" id="fPesq" style="grid-template-columns:repeat(5,1fr)">
        <button data-v="" class="on">Todas</button>
        <button data-v="1">P1</button>
        <button data-v="2">P2</button>
        <button data-v="3">P3</button>
        <button data-v="4">P4</button>
      </div>
    </div>
    <div class="field">Status
      <div class="seg" id="fVis" style="grid-template-columns:repeat(3,1fr)">
        <button data-v="" class="on">Todos</button><button data-v="0">Pendentes</button><button data-v="1">Visitados</button>
      </div>
    </div>
    <label class="field">Buscar<input type="search" id="fBusca" placeholder="Nome, bairro ou cidade" enterkeyhint="search"></label>
    <label class="switch">Só PDVs para revisar<input type="checkbox" id="fRev"></label>
    <label class="switch">Agrupar pins próximos<input type="checkbox" id="fCluster" checked></label>
  </div>
  <div class="factions">
    <button id="btnLimpar">Limpar</button>
    <button id="btnAplicar">Ver resultados</button>
  </div>
</section>
<div id="toast"></div>

const COR = { 'Diurna': '#d98200', 'Noturna': '#4338ca', 'Sem Horário': '#6b7280' };
const COR_OK = '#15803d';
const TRECHO = 10;          // paradas por link do Google Maps (destino + até 9 intermediárias)
const LIST_MAX = 400;
const isDesktop = () => window.matchMedia('(min-width: 900px)').matches;
const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq = arr => [...new Set(arr.filter(v => v !== ''))].sort((a, b) => String(a).localeCompare(String(b), 'pt-BR', {numeric: true}));
const fmtKm = v => v.toFixed(1).replace('.', ',') + ' km';
const fmtHora = h => { const m = Math.round((h % 1) * 60); return `${Math.floor(h)}h${m ? String(m).padStart(2, '0') : ''}`; };
const corDe = r => r.vis ? COR_OK : (COR[r.tipo] || COR['Sem Horário']);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('rotpdv:' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('rotpdv:' + k, JSON.stringify(v)); } catch (e) {} }
};
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2500); }

/* ---------- Mapa ---------- */
const map = L.map('map', { zoomControl: false, tap: true }).setView([-23.55, -46.63], 10);
L.control.zoom({ position: 'topleft' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);
const legend = L.control({ position: 'topright' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = Object.entries(COR).map(([k, c]) => `<div><i style="background:${c}"></i>${k}</div>`).join('') +
    `<div><i style="background:${COR_OK}"></i>Visitado</div>`;
  return d;
};
legend.addTo(map);

/* ---------- Estado dos filtros ---------- */
const F = Object.assign({ reg: '', tipo: '', dia: '', unb: '', vis: '', q: '', rev: false, cluster: true, pesq: '' }, store.get('filtros') || {});

function setSeg(el, v) { el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function bindSeg(el, key) {
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    F[key] = b.dataset.v; setSeg(el, F[key]);
    if (key === 'tipo' || key === 'pesq') { F.dia = ''; atualizarOpcoes(); }
    render();
  });
}
function fillSelect(el, values, allLabel, labels = {}) {
  el.innerHTML = `<option value="">${allLabel}</option>` +
    values.map(v => `<option value="${esc(v)}">${esc(labels[v] || v)}</option>`).join('');
}
// DIA_INFO pré-computado por pesquisadora (0 = todas)
const pesqVals = [...new Set(DATA.map(r => r.pesq).filter(Boolean))].sort((a,b)=>a-b);
const DIA_INFO_ALL = {};
for (const p of [0, ...pesqVals]) {
  const info = {};
  DATA.filter(r => p === 0 || r.pesq === p).forEach(r => {
    const d = info[r.dia] || (info[r.dia] = { n: 0, km: 0, data: r.data, tipo: r.tipo });
    d.n++; d.km = Math.max(d.km, r.dAcum);
  });
  DIA_INFO_ALL[p] = info;
}
const getDiaInfo = () => DIA_INFO_ALL[F.pesq ? Number(F.pesq) : 0] || {};
const diaLabel = d => { const i = getDiaInfo()[d]; return i && i.data ? `${d} · ${i.data.slice(0, 5)} · ${i.tipo} · ${i.n} PDVs` : d; };

function atualizarOpcoes() {
  fillSelect($('fReg'), uniq(DATA.map(r => r.reg)), 'Todas');
  if (F.reg && !DATA.some(r => r.reg === F.reg)) F.reg = '';
  $('fReg').value = F.reg;
  const b1 = DATA.filter(r => (!F.reg || r.reg === F.reg) && (!F.tipo || r.tipo === F.tipo) && (!F.pesq || String(r.pesq) === F.pesq));
  const _di = getDiaInfo();
  const dias = uniq(b1.map(r => r.dia)).sort((a, b) => {
    const da = (_di[a]?.data || '').split('/').reverse().join(''), db = (_di[b]?.data || '').split('/').reverse().join('');
    return da.localeCompare(db) || a.localeCompare(b);
  });
  fillSelect($('fDia'), dias, 'Todos os dias', Object.fromEntries(dias.map(d => [d, diaLabel(d)])));
  if (!dias.includes(F.dia)) F.dia = '';
  $('fDia').value = F.dia;
  const b2 = b1.filter(r => !F.dia || r.dia === F.dia);
  const unbs = uniq(b2.map(r => r.unb));
  fillSelect($('fUnb'), unbs, 'Todas');
  if (!unbs.includes(F.unb)) F.unb = '';
  $('fUnb').value = F.unb;
}

/* ---------- Popup ---------- */
function linkNavegar(r) { return `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lon}&travelmode=driving`; }
function popup(r) {
  const tel = r.tel ? r.tel.replace(/\D/g, '') : '';
  const turno = r.abre != null ? `${esc(r.turno)} · abre ${fmtHora(r.abre)}` : esc(r.turno);
  const warn = [];
  if (r.abreDia === 'NÃO') warn.push('Fechado no dia previsto');
  if (r.rev) warn.push('Revisar: ' + esc(r.rev));
  return `<div class="pop">
    <span class="tag" style="background:${corDe(r)}">${r.vis ? 'Visitado' : esc(r.tipo)}</span>
    <h3>${esc(r.nome)}</h3>
    ${warn.length ? `<div class="warn">${warn.join('<br>')}</div>` : ''}
    <dl>
      <dt>Rota</dt><dd>${esc(r.dia)} · parada ${r.ord}${r.data ? ' · ' + esc(r.data) : ''}</dd>
      <dt>Endereço</dt><dd>${esc(r.end)}</dd>
      <dt>Turno</dt><dd>${turno}</dd>
      <dt>Horário</dt><dd>${esc(r.hor) || '—'}</dd>
      <dt>Distância</dt><dd>${fmtKm(r.dAnt)} da anterior</dd>
      <dt>UNB</dt><dd>${esc(r.unb)}</dd>
    </dl>
    <div class="acts">
      <a class="chip primary" href="${linkNavegar(r)}" target="_blank" rel="noopener">Navegar</a>
      ${tel ? `<a class="chip" href="tel:${tel}">Ligar</a>` : ''}
    </div>
  </div>`;
}
function icone(r) {
  return L.divIcon({ className: '', iconSize: [28, 28], iconAnchor: [14, 28], popupAnchor: [0, -26],
    html: `<div class="pin" style="background:${corDe(r)}"><span>${r.ord}</span></div>` });
}

/* ---------- Links de rota no Google Maps ---------- */
function linksRota(recs) {
  const seq = [...recs].sort((a, b) => a.ord - b.ord);
  const out = [];
  for (let i = 0; i < seq.length; i += TRECHO) {
    const parte = seq.slice(i, i + TRECHO);
    const dest = parte[parte.length - 1];
    const wps = parte.slice(0, -1).map(r => `${r.lat},${r.lon}`).join('|');
    const url = `https://www.google.com/maps/dir/?api=1&destination=${dest.lat},${dest.lon}` +
      (wps ? `&waypoints=${encodeURIComponent(wps)}` : '') + '&travelmode=driving';
    out.push({ url, label: seq.length <= TRECHO ? 'Abrir rota no Maps' : `Paradas ${parte[0].ord}–${dest.ord}` });
  }
  return out;
}

/* ---------- Render ---------- */
let camada = null, linha = null, filtrados = [];
const markers = new Map();

function contarFiltros() {
  return ['reg', 'tipo', 'dia', 'unb', 'vis', 'q', 'pesq'].filter(k => F[k]).length + (F.rev ? 1 : 0);
}

function render(ajustar = true) {
  const q = F.q.trim().toLowerCase();
  filtrados = DATA.filter(r =>
    (!F.reg || r.reg === F.reg) && (!F.tipo || r.tipo === F.tipo) && (!F.dia || r.dia === F.dia) &&
    (!F.unb || r.unb === F.unb) && (F.vis === '' || String(r.vis) === F.vis) && (!F.rev || r.rev) &&
    (!F.pesq || String(r.pesq) === F.pesq) &&
    (!q || `${r.nome} ${r.bai} ${r.cid}`.toLowerCase().includes(q))
  );
  store.set('filtros', F);

  if (camada) map.removeLayer(camada);
  if (linha) { map.removeLayer(linha); linha = null; }
  markers.clear();
  const umDia = !!F.dia;
  camada = (F.cluster && !umDia) ? L.markerClusterGroup({ maxClusterRadius: 50, chunkedLoading: true }) : L.featureGroup();
  const popMax = Math.min(320, window.innerWidth - 60);
  const pad = isDesktop() ? [20, 20] : [16, 110];
  filtrados.forEach(r => {
    const m = L.marker([r.lat, r.lon], { icon: icone(r), title: r.nome })
      .bindPopup(() => popup(r), { maxWidth: popMax, minWidth: Math.min(240, popMax), autoPanPaddingTopLeft: [10, 10], autoPanPaddingBottomRight: pad });
    markers.set(r, m);
    camada.addLayer(m);
  });
  camada.addTo(map);

  let seqDia = [];
  if (umDia && filtrados.length) {
    seqDia = [...filtrados].sort((a, b) => a.ord - b.ord);
    if (seqDia.length > 1) linha = L.polyline(seqDia.map(r => [r.lat, r.lon]), { color: '#e0671f', weight: 4, opacity: .85, dashArray: '8 8' }).addTo(map);
  }
  if (ajustar && filtrados.length) {
    map.fitBounds(L.latLngBounds(filtrados.map(r => [r.lat, r.lon])),
      { paddingTopLeft: [20, 20], paddingBottomRight: isDesktop() ? [20, 20] : [20, 110], maxZoom: 16 });
  }

  // resumo
  const nVis = filtrados.filter(r => r.vis).length;
  $('fBadge').textContent = contarFiltros() || '';
  if (umDia) {
    const i = getDiaInfo()[F.dia] || {};
    const kmDia = filtrados.length ? Math.max(...filtrados.map(r => r.dAcum)) : 0;
    $('subtitle').textContent = `${F.dia}${i.data ? ' · ' + i.data : ''}${F.pesq ? ' · P' + F.pesq : ''}`;
    $('sumLine1').textContent = `${filtrados.length} PDVs · ${fmtKm(kmDia)}`;
    $('sumLine2').textContent = `${i.tipo || ''}${nVis ? ` · ${nVis} visitados` : ''} · toque para ver a sequência`;
  } else {
    $('subtitle').textContent = F.reg || 'Todos os PDVs';
    $('sumLine1').textContent = `${filtrados.length.toLocaleString('pt-BR')} PDVs`;
    $('sumLine2').textContent = `${new Set(filtrados.map(r => r.dia)).size} rotas${nVis ? ` · ${nVis} visitados` : ''} · selecione um dia em Filtros`;
  }
  $('navLinks').innerHTML = umDia ? linksRota(seqDia).map((l, k) =>
    `<a class="chip ${k === 0 ? 'primary' : ''}" href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('') : '';

  // lista
  const lista = umDia ? seqDia : filtrados;
  const mostrar = lista.slice(0, LIST_MAX);
  $('lista').innerHTML = mostrar.map((r, i) => {
    const flags = (r.abreDia === 'NÃO' ? '<span class="flag">fechado no dia</span>' : '') + (r.rev ? '<span class="flag">revisar</span>' : '');
    const sub = umDia ? `${esc(r.bai)} · ${fmtKm(r.dAnt)}` : `${esc(r.dia)} · ${esc(r.bai)} · ${esc(r.cid)}`;
    return `<button class="item" data-i="${i}"><span class="num" style="background:${corDe(r)}">${r.ord}</span>
      <span><b>${esc(r.nome)}${flags}</b><small>${sub}</small></span></button>`;
  }).join('') + (lista.length > LIST_MAX ? `<div class="more">+${lista.length - LIST_MAX} PDVs — use os filtros para reduzir</div>` : '')
    + (lista.length ? '' : '<div class="more">Nenhum PDV com esses filtros.</div>');
  $('lista').onclick = e => {
    const b = e.target.closest('.item'); if (!b) return;
    const r = mostrar[+b.dataset.i], m = markers.get(r);
    if (!isDesktop()) setSheet(false);
    const abrir = () => m.openPopup();
    if (camada.zoomToShowLayer) camada.zoomToShowLayer(m, abrir);
    else { map.setView([r.lat, r.lon], Math.max(map.getZoom(), 16)); setTimeout(abrir, 250); }
  };
  ajustarPeek();
}

/* ---------- Sheet e painel ---------- */
function ajustarPeek() {
  const h = $('sheetHead').offsetHeight + $('navLinks').offsetHeight;
  document.documentElement.style.setProperty('--sheet-peek', h + 'px');
}
function setSheet(open) { $('sheet').classList.toggle('collapsed', !open); $('sheetHead').setAttribute('aria-label', open ? 'Ocultar lista' : 'Mostrar lista'); }
$('sheetHead').addEventListener('click', () => { if (!isDesktop()) setSheet($('sheet').classList.contains('collapsed')); });

// arrastar o sheet (swipe para cima/baixo)
(() => {
  let y0 = null;
  const h = $('sheetHead');
  h.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  h.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (Math.abs(dy) > 30) { e.preventDefault(); setSheet(dy < 0); }
  });
})();

function abrirFiltros(v) {
  $('filters').classList.toggle('show', v); $('scrim').classList.toggle('show', v);
  if (v && !isDesktop()) setSheet(false);
}
$('btnFiltros').onclick = () => { if ($('filters').classList.contains('show')) fecharFiltros(); else abrirFiltros(true); };
function fecharFiltros() {
  $('filters').classList.remove('show'); $('scrim').classList.remove('show');
  atualizarOpcoes(); render();
}
$('btnFechar').onclick = $('scrim').onclick = fecharFiltros;
$('btnAplicar').onclick = fecharFiltros;

$('fReg').onchange = e => { F.reg = e.target.value; F.dia = ''; atualizarOpcoes(); render(); };
$('fDia').onchange = e => { F.dia = e.target.value; atualizarOpcoes(); render(); };
$('fUnb').onchange = e => { F.unb = e.target.value; render(); };
bindSeg($('fTipo'), 'tipo');
bindSeg($('fVis'), 'vis');
bindSeg($('fPesq'), 'pesq');
let tBusca;
$('fBusca').oninput = e => { clearTimeout(tBusca); tBusca = setTimeout(() => { F.q = e.target.value; render(); }, 250); };
$('fRev').onchange = e => { F.rev = e.target.checked; render(); };
$('fCluster').onchange = e => { F.cluster = e.target.checked; render(false); };
$('btnLimpar').onclick = () => {
  Object.assign(F, { reg: '', tipo: '', dia: '', unb: '', vis: '', q: '', rev: false, pesq: '' });
  syncUI(); atualizarOpcoes(); render();
};
function syncUI() {
  setSeg($('fTipo'), F.tipo); setSeg($('fVis'), F.vis); setSeg($('fPesq'), F.pesq);
  $('fBusca').value = F.q; $('fRev').checked = F.rev; $('fCluster').checked = F.cluster;
}

/* ---------- Localização ---------- */
let meuPonto = null;
$('btnLocate').onclick = () => {
  if (!navigator.geolocation) return toast('Localização não disponível neste navegador');
  toast('Buscando sua localização…');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (meuPonto) map.removeLayer(meuPonto);
    meuPonto = L.circleMarker(ll, { radius: 9, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 15));
  }, err => {
    toast(location.protocol === 'https:' ? 'Permita o acesso à localização' : 'Localização exige o mapa aberto por um link https');
  }, { enableHighAccuracy: true, timeout: 10000 });
};

window.addEventListener('resize', () => { map.invalidateSize(); ajustarPeek(); });
syncUI();
atualizarOpcoes();
render();
</script>
</body>
</html>
